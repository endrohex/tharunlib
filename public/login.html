<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Librarian Login | Central City Library</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">📚</div>
        <h1 class="auth-title">Library Staff Portal</h1>
        <p class="auth-subtitle">Sign in to manage books, rentals, and transactions</p>
      </div>

      <!-- Error Alert Box -->
      <div id="auth-error" class="auth-error" role="alert"></div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">
            Email Address <span class="required">*</span>
          </label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="admin@library.org" 
            required 
            autocomplete="email" 
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">
            Password <span class="required">*</span>
          </label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="••••••••••••" 
              required 
              autocomplete="current-password" 
            />
            <button type="button" id="toggle-password" class="password-toggle-btn" aria-label="Toggle password visibility">
              👁️
            </button>
          </div>
        </div>

        <div class="auth-remember">
          <label>
            <input type="checkbox" id="remember-me" checked />
            Remember my session
          </label>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%;">
          Sign In to Dashboard →
        </button>
      </form>

      <div class="auth-footer">
        <p>Protected by Firebase Authentication. Unauthorized access prohibited.</p>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Firebase Web SDK Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
